const usd=n=>"$"+Math.round(n).toLocaleString("en-US");
const byId=id=>TRIPS.find(t=>t.id===id);
const ratioOf=(t,i)=>t.cheap.includes(i)?.82:t.peak.includes(i)?1.34:1;
function costs(t,month,mode){
  const r=ratioOf(t,month), pl=mode==="planned";
  const flights=t.flights*r, bed=t.bed*r*(pl?1.2:1);
  const transport=pl?t.days*2200*r:0, planning=pl?6000+t.days*1500:0;
  return {flights,bed,transport,planning,total:flights+bed+transport+planning};
}

let people=[{n:"You",paid:true,you:true}], deadlineDays=14, linkMade=false;
const fmtDate=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
function deadlineDate(){const d=new Date();d.setDate(d.getDate()+deadlineDays);return d;}

function viewPlan(id,month,mode){
  const t=byId(id); if(!t||!MODES[mode]) return viewMissing();
  const c=costs(t,+month,mode), fee=FEE[mode];
  const done=people.filter(p=>p.paid).length, left=people.length-done;
  const colors=["var(--pink)","var(--aqua)","var(--blue)","var(--paper-2)"];
  return `<div class="wrap">
  <a class="back" href="#/trip/${t.id}">Back to ${t.city}</a>
  <div class="flow">
    <div>
      <h1>Plan ${t.city}</h1>
      <p class="lede">${MODES[mode].name}, ${t.days} nights, flying in ${M[+month]}. Everyone books their own flight and bed. We make sure it actually happens.</p>

      <div class="block">
        <h2>Who's coming</h2>
        <p class="hint">Two to eight people. First names are enough — we don't need their contacts.</p>
        <div>${people.map((p,i)=>`<div class="person">
          <div class="avatar" style="background:${colors[i%4]}">${p.n[0].toUpperCase()}</div>
          <span class="who">${p.n}</span>${p.you?'<span class="you">that\'s you</span>':""}
          ${p.you?"":`<button class="rm" type="button" data-rm="${i}" aria-label="Remove ${p.n}">×</button>`}
        </div>`).join("")}</div>
        <div class="addrow">
          <input id="nameIn" type="text" placeholder="Add a name" maxlength="18" ${people.length>=8?"disabled":""}>
          <button class="btn btn-blue" id="addBtn" ${people.length>=8?"disabled":""}>Add</button>
        </div>
        ${people.length>=8?'<p class="hint" style="margin:12px 0 0">That\'s the maximum. Bigger groups need two plans.</p>':""}
      </div>

      <div class="block">
        <h2>Everyone books by</h2>
        <p class="hint">Prices move. Pick a date and we'll nudge whoever hasn't booked yet.</p>
        <div class="chips">${[3,5,7].map(d=>`<button class="chip" type="button" data-dl="${d}" aria-pressed="${d===deadlineDays}">In ${d} days</button>`).join("")}</div>
        <div class="deadline-note">Everyone books by <b>${fmtDate(deadlineDate())}</b>. Two reminders, not eleven.</div>
      </div>

      <div class="block">
        <h2>What we charge</h2>
        ${linkMade?`
          <p class="hint">Paid. Here's the link — send it to the group chat.</p>
          <div class="linkbox"><input id="linkIn" readonly value="offpeak.app/p/${t.id}-${Math.abs(hashOf(people.map(p=>p.n).join()+deadlineDays))}"><button class="btn btn-blue" id="copyBtn">Copy</button></div>

          <div>${people.map((p,i)=>`<div class="person">
            <div class="avatar" style="background:${colors[i%4]}">${p.n[0].toUpperCase()}</div>
            <span class="who">${p.n}</span>
            <button class="paid-btn" type="button" data-paid="${i}" aria-pressed="${p.paid}" style="margin-left:auto">${p.paid?"booked":"not yet"}</button>
          </div>`).join("")}</div>
          ${left===0
            ? `<div class="deadline-note" style="background:var(--aqua)">Everyone's booked. ${t.city} is happening.</div>`

          ${people.length<2?'<p class="hint" style="margin:12px 0 0">Add at least one other person first.</p>':""}
        `}
        <ul class="rules">
          <li>We never touch the money for your flights or your beds.</li>
          <li>If the trip falls apart before the deadline, the fee comes back.</li>
          <li>Book refundable rates and you can change your mind right up to the cutoff.</li>
        </ul>
      </div>
    </div>

    <div class="sticky">

        <div class="pass-top"><div class="display">${t.city}</div><span>${t.days} NIGHTS<br>${M[+month].toUpperCase()}</span></div>

          <div class="r" style="font-size:14px;opacity:.7"><span>Book by</span><span class="mono">${fmtDate(deadlineDate())}</span></div>
        </div>
      </div>
      <p style="font-size:15px;opacity:.75;margin-top:16px">${mode==="planned"?"The planned fee covers the route, the beds we picked, and someone local you can message.":"Going planned instead costs "+usd(FEE.planned)+" and we work out the whole route."}</p>
    </div>
  </div>
</div>${ctaBlock}`;}
function hashOf(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h%9999;}

  if(!list.length) return `<div class="wrap saved-head"><h1>Nothing saved yet.</h1>
    <p style="max-width:40ch;margin-top:16px;font-size:19px">Tap the heart on any trip and it lands here. Then you can see what the whole list would cost.</p>
    <p style="margin-top:24px"><a class="btn btn-lg btn-pink" href="#/">Go find some</a></p></div>${ctaBlock}`;
  const total=list.reduce((s,t)=>s+t.price,0), cheapest=list.reduce((a,b)=>a.price<b.price?a:b);
  return `<div class="wrap saved-head"><h1>Your list</h1><div class="saved-total">
    <div class="stat"><b>${list.length}</b><span>trips saved</span></div>
    <div class="stat"><b>${usd(total)}</b><span>all of them, alone</span></div>
    <div class="stat"><b>${usd(total/4)}</b><span>all of them, split four ways</span></div>
    <div class="stat"><b>${cheapest.city}</b><span>cheapest at ${usd(cheapest.price)}</span></div>
  </div></div>
  <main class="results wrap"><div class="grid">${list.map(tagCard).join("")}</div></main>${ctaBlock}`;}

function viewAbout(){return `<div class="wrap about">
  <h1>We only sell trips that are cheap for a reason.</h1>
  <p>Most travel sites start by asking where you want to go. That only works if you already know. Usually you don't — you just know you want to be somewhere else, and you know roughly what you can spend.</p>
  <p>So OFFPEAK starts with the feeling and the number, and works backwards.</p>
  <h2>Why things cost less here</h2>
  <p>Nothing clever. Flights and beds swing hard by month, and most people book the expensive months because that's when they have time off. If you're flexible — and at this stage of your life you probably are — the same trip can cost 30 to 40% less six weeks either side.</p>
  <p>Every trip page shows all twelve months and what each one costs. Green means cheap. That's the entire business.</p>
  <h2>On your own, or planned</h2>
  <p>Every destination comes two ways. <b>On your own</b> is flights and a bed in one city, and then you're free — it's the cheaper one and it's what most people pick. <b>Planned for you</b> is a route across a few places with the transport and the bookings between them already handled, plus someone local who answers messages.</p>
  <p>Take the planned version if you're going somewhere you'd rather not work out the buses, or with people who say they'll plan and then don't.</p>
  <h2>How we make money, since you'll wonder</h2>
  <p>We charge a flat fee per person. ¥800 each if you're going on your own, ¥2,500 each if you want the whole route planned. That's it, and it's the same number whether your trip costs ¥40,000 or ¥200,000.</p>
  <p>We don't sell you the flight and we don't sell you the bed. You book those yourself, wherever you like, at the price everyone else pays. We take no commission from any hotel or airline, which means when we tell you a place is worth it, there's no money riding on your answer.</p>
  <h2>Planning it together</h2>
  <p>Add everyone's names, set a date by which they all have to book, and pay the fee once. Everyone gets a link, books their own flight and bed, and you can see who hasn't. We send the reminders so you don't have to be the person nagging the group chat.</p>
  <p>Nobody fronts anyone else's money, because there's no shared payment to front. If the trip falls apart before the deadline, the fee comes back.</p>
  <h2>Cancellation</h2>
  <p>Free until 14 days before you fly. After that you get the accommodation back but not the flight, because the airline won't give it to us either. We'll tell you this again at checkout so it isn't a surprise.</p>
  <h2>The honest bit</h2>
  <p>We're small. There are twelve destinations right now, all places we've been. When that becomes twenty it'll be because someone went, not because a database got bigger.</p>
  <p style="margin-top:28px"><a class="btn btn-lg btn-pink" href="#/">Start with a vibe</a></p>
</div>${ctaBlock}`;}

function viewMissing(){return `<div class="wrap about"><h1>That trip doesn't exist.</h1>
  <p>The link might be old, or we might have retired it. Either way, there are eleven others.</p>
  <p style="margin-top:24px"><a class="btn btn-lg btn-pink" href="#/">Back to all trips</a></p></div>${ctaBlock}`;}

/* ---------------- home behaviour ---------------- */
function matches(t){if(t.price>maxBudget)return false;if(!active.size)return true;return [...active].some(v=>t.vibes.includes(v));}
function renderGrid(){
  const grid=document.getElementById("grid"); if(!grid) return;
  const list=TRIPS.filter(matches).sort((a,b)=>a.price-b.price);
  document.getElementById("rCount").textContent=list.length+" of "+TRIPS.length+" under "+usd(maxBudget);
  document.getElementById("rTitle").textContent=!active.size?"Everywhere we go":(list.length?"For "+[...active].join(" + "):"Nothing matches that");
  grid.innerHTML=list.length?list.map(tagCard).join("")
    :`<div class="empty"><h3>That combination doesn't exist yet.</h3><p>Nothing under ${usd(maxBudget)} feels like that. Raise the budget or drop a vibe.</p><button class="btn btn-blue" id="clearBtn">Clear filters</button></div>`;
}
const DEMO=[{n:"You",p:true},{n:"Renz",p:true},{n:"Mika",p:false},{n:"Ari",p:false}];
function renderDemo(){
  const el=document.getElementById("friends"); if(!el) return;
  const share=FEE.solo;
  document.getElementById("perPerson").textContent=usd(share);
  const colors=["var(--pink)","var(--aqua)","var(--blue)","var(--paper-2)"];
  el.innerHTML=DEMO.map((f,i)=>`<div class="friend"><div class="avatar" style="background:${colors[i%4]}">${f.n[0]}</div>
    <div class="friend-name">${f.n}</div>
    <button class="paid-btn" type="button" data-demo="${i}" aria-pressed="${f.p}">${f.p?"booked":"not yet"}</button>
    <div class="friend-amt">${usd(share)}</div></div>`).join("");
}
let heroTimer=null;
function startHero(){
  clearInterval(heroTimer);
  const el=document.getElementById("vibeWord"); if(!el) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const W=["unwell","cold","invisible","broke","tiny","awake","far away"]; let i=0;
  heroTimer=setInterval(()=>{i=(i+1)%W.length;el.textContent=W[i];},2000);
}
function resetAll(){
  active.clear(); maxBudget=1500;
  document.querySelectorAll(".pill").forEach(p=>p.setAttribute("aria-pressed","false"));
  const b=document.getElementById("budget");
  if(b){b.value=220000;document.getElementById("budgetVal").textContent=usd(220000);}
  renderGrid();
}

/* ---------------- router ---------------- */
let curHash="/";
function route(keepScroll){
  const h=location.hash.replace(/^#/,"")||"/";
  const app=document.getElementById("app");
  const sp=h.match(/^\/plan\/([^/]+)\/([^/]+)\/([^/]+)$/), tr=h.match(/^\/trip\/(.+)$/);
  if(sp){ if(curHash!==h){people=[{n:"You",paid:true,you:true}];linkMade=false;deadlineDays=14;} app.innerHTML=viewPlan(sp[1],sp[2],sp[3]); }
  else if(tr){ if(curHash!==h) selMonth=null; app.innerHTML=viewTrip(tr[1]); }
  else if(h==="/saved") app.innerHTML=viewSaved();
  else if(h==="/about") app.innerHTML=viewAbout();
  else { app.innerHTML=viewHome(); renderGrid(); renderDemo(); startHero(); }
  document.querySelectorAll("#navLinks a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h));
  syncSaved();
  if(!keepScroll && curHash!==h) window.scrollTo(0,0);
  curHash=h;
}
window.addEventListener("hashchange",()=>route());

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const save=t.closest("[data-save]");
  if(save){e.preventDefault();e.stopPropagation();const id=save.dataset.save;
    saved.has(id)?saved.delete(id):saved.add(id);
    save.setAttribute("aria-pressed",saved.has(id));
    if(save.classList.contains("btn")) save.textContent=saved.has(id)?"♥ Saved":"♥ Save this";
    syncSaved();return;}
  const pill=t.closest("[data-vibe]");
  if(pill){const v=pill.dataset.vibe;active.has(v)?active.delete(v):active.add(v);
    pill.setAttribute("aria-pressed",active.has(v));renderGrid();return;}
  const mo=t.closest("[data-month]"); if(mo){selMonth=+mo.dataset.month;route(true);return;}
  const md=t.closest("[data-mode]"); if(md){selMode=md.dataset.mode;route(true);return;}
  const dl=t.closest("[data-dl]"); if(dl){deadlineDays=+dl.dataset.dl;route(true);return;}
  const rm=t.closest("[data-rm]"); if(rm){people.splice(+rm.dataset.rm,1);route(true);return;}
  const pd=t.closest("[data-paid]"); if(pd){const i=+pd.dataset.paid;people[i].paid=!people[i].paid;route(true);return;}
  const dm=t.closest("[data-demo]"); if(dm){const i=+dm.dataset.demo;DEMO[i].p=!DEMO[i].p;renderDemo();return;}
  if(t.id==="addBtn"){addPerson();return;}
  if(t.id==="makeLink"){linkMade=true;route(true);return;}
  if(t.id==="copyBtn"){
    const inp=document.getElementById("linkIn");
    const done=()=>{t.textContent="Copied";setTimeout(()=>t.textContent="Copy",1600);};
    if(navigator.clipboard) navigator.clipboard.writeText(inp.value).then(done).catch(()=>{inp.select();t.textContent="Press ⌘C";});
    else {inp.select();t.textContent="Press ⌘C";}
    return;}
  if(t.id==="clearBtn"){resetAll();return;}
  if(t.id==="goPick"){document.getElementById("pick").scrollIntoView();return;}
  if(t.id==="surpriseBtn"){resetAll();const tp=TRIPS[Math.floor(Math.random()*TRIPS.length)];
    hitId=tp.id;renderGrid();document.getElementById("c-"+tp.id).scrollIntoView({block:"center"});return;}
});
function addPerson(){
  const inp=document.getElementById("nameIn"); if(!inp) return;
  const n=inp.value.trim(); if(!n||people.length>=8) return;
  people.push({n,paid:false}); route(true);
  const next=document.getElementById("nameIn"); if(next) next.focus();
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nameIn"){e.preventDefault();addPerson();}});
document.addEventListener("input",e=>{
  if(e.target.id==="budget"){maxBudget=+e.target.value;
    document.getElementById("budgetVal").textContent=usd(maxBudget);renderGrid();}
});
route();
</script>
<script>
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
